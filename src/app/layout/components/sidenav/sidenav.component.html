<ion-list lines="none">
  <ion-item
    *ngFor="let item of items$ | async"
    [routerLink]="item.route"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: false }"
    button
    detail="false"
    (click)="navigate.emit()"
  >
    <ion-icon slot="start" [name]="item.icon"></ion-icon>
    <ion-label>{{ item.label }}</ion-label>
  </ion-item>
</ion-list>
